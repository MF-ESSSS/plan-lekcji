<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#292735"><title>Plan lekcji</title><link rel="stylesheet" href="style.css"></head>
<body><header>
<div class="title-row"><h1>Kalendarz</h1><div class="ribbons" aria-hidden="true"><svg viewBox="0 0 182 170"><defs><linearGradient id="r1"><stop stop-color="#1477ba"/><stop offset=".47" stop-color="#91d56e"/><stop offset="1" stop-color="#1b8cce"/></linearGradient><linearGradient id="r2"><stop stop-color="#203b9a"/><stop offset=".55" stop-color="#378fc6"/><stop offset="1" stop-color="#3648ac"/></linearGradient></defs><path d="M68-18C-6 48 14 100 87 81L200 30" fill="none" stroke="url(#r1)" stroke-width="25"/><path d="M115-39C-68 85-4 84 97 43L207-16" fill="none" stroke="url(#r2)" stroke-width="25"/><g transform="translate(124 68)" fill="#368bc4"><path d="M-12 18C-13 5-11-7 0-7S14 6 12 18L17 26Q0 31-17 26Z"/><circle cy="4" r="10" fill="#292735"/><circle cx="-4" cy="2" r="2"/><circle cx="4" cy="2" r="2"/><path d="M-5 9Q0 14 5 9" fill="none" stroke="#368bc4" stroke-width="2"/></g><text x="88" y="139" text-anchor="middle" fill="#4785ae" font-family="Arial,sans-serif" font-size="13">pawel.taustales</text></svg></div></div>
<div class="tabs" role="tablist" aria-label="Widok kalendarza"><button id="day" role="tab" aria-selected="true">Dzień</button><button id="week" role="tab" aria-selected="false">Tydzień</button></div>
<div class="dates"><button id="previous" aria-label="Poprzedni tydzień"></button><div id="month"></div><div id="days"></div><button id="next" aria-label="Następny tydzień"></button></div>
<div class="accent" id="date-marks" aria-label="Prace domowe i sprawdziany"></div>
</header><main id="scroll"><div id="calendar"></div></main>
<div class="add-reference" aria-hidden="true">+</div>
<footer aria-label="Kalendarz"><div class="nav-item" aria-hidden="true"><svg viewBox="0 0 40 40"><path d="M3 19L20 4L37 19M8 17V36H17V25H24V36H33V17"/></svg><span>Start</span></div><div class="nav-item selected"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M6 9H34V36H6ZM6 16H34M12 3V12M28 3V12"/><path d="M12 22H15M20 22H23M28 22H29M12 29H15M20 29H23M28 29H29"/></svg><span>Kalendarz</span></div><div class="nav-item" aria-hidden="true"><svg viewBox="0 0 40 40"><path d="M8 29H32L28 23V15C28 3 12 3 12 15V23ZM16 34Q20 40 24 34"/></svg><span class="lock"><svg viewBox="0 0 20 20"><path d="M5 9H15V17H5ZM7 9V5C7 1 13 1 13 5V9M10 12V14"/></svg></span><span>Powiadomienia</span></div><div class="nav-item" aria-hidden="true"><svg viewBox="0 0 40 40"><rect x="3" y="9" width="34" height="25" rx="3"/><path d="M4 10L20 24L36 10"/></svg><span class="lock"><svg viewBox="0 0 20 20"><path d="M5 9H15V17H5ZM7 9V5C7 1 13 1 13 5V9M10 12V14"/></svg></span><span>Wiadomości</span></div><div class="nav-item" aria-hidden="true"><svg class="more" viewBox="0 0 40 40"><circle cx="20" cy="9" r="3"/><circle cx="20" cy="21" r="3"/><circle cx="20" cy="33" r="3"/></svg><span>Więcej</span></div></footer>
<div id="editor" class="editor-overlay" hidden>
<section class="editor-panel" role="dialog" aria-modal="true" aria-labelledby="editor-title">
<div class="editor-heading"><h2 id="editor-title">Edytuj plan lekcji</h2><button id="close-editor" type="button" aria-label="Zamknij edytor">×</button></div>
<p class="editor-note">Zmień plan na wybrany dzień tygodnia. Zapisane zmiany obowiązują co tydzień i pozostają na tym urządzeniu.</p>
<label class="day-picker">Dzień tygodnia<select id="edit-day"><option value="1">Poniedziałek</option><option value="2">Wtorek</option><option value="3">Środa</option><option value="4">Czwartek</option><option value="5">Piątek</option></select></label>
<p id="lesson-count"></p><div id="edit-list"></div>
<form id="add-lesson" novalidate><h3>Dodaj lekcję</h3>
<label>Przedmiot<input id="lesson-name" list="subject-options" maxlength="200" autocomplete="off" placeholder="Wybierz lub wpisz nazwę"><datalist id="subject-options"></datalist></label>
<div class="editor-times"><label>Początek<input id="lesson-start" type="time" min="06:00" step="60"></label><label>Koniec<input id="lesson-end" type="time" min="06:00" step="60"></label></div>
<label>Sala (opcjonalnie)<input id="lesson-room" maxlength="30" autocomplete="off" placeholder="Np. 213"></label>
<button type="submit" class="add-lesson-button">Dodaj lekcję</button></form>
<section class="note-editor"><h3>Prace domowe i sprawdziany</h3>
<p class="editor-note">Wpisy dotyczą konkretnej daty i nie powtarzają się co tydzień.</p>
<label>Data<input id="note-date" type="date"></label><div id="note-list"></div>
<form id="add-note" novalidate>
<label>Rodzaj<select id="note-type"><option value="homework">Praca domowa — niebieski</option><option value="test">Sprawdzian — czerwony</option></select></label>
<label>Przedmiot<input id="note-subject" list="subject-options" maxlength="200" placeholder="Wybierz lub wpisz przedmiot"></label>
<label>Opis (opcjonalnie)<textarea id="note-text" maxlength="600" rows="2" placeholder="Co przygotować?"></textarea></label>
<button type="submit" class="add-lesson-button">Dodaj wpis</button></form></section>
<p id="editor-error" role="alert"></p>
<div class="editor-actions"><button id="cancel-editor" type="button">Anuluj</button><button id="save-day" type="button">Zapisz zmiany</button></div>
</section></div>
<script src="app.js"></script></body></html>
